#!name=91rb 无限制观看
#!desc=通过QX策略组轮询自动换IP，实现91rb.net无限制观看
#!author=You
#!homepage=https://github.com/XXXGITHUB777/x
#!date=2026-08-07

# ==================== 使用方法 ====================
# 1. 在QX [server_local] 中添加你的节点
# 2. 在 [policy] 中创建一个名为 "91rb-Pool" 的 round-robin 策略组
#    包含多个不同IP的节点
# 3. 在 [filter_local] 中添加91rb分流规则
# 4. 重启QX，访问91rb，每次请求自动换IP
#
# ==================== 配置示例 ====================
# 在 [server_local] 中添加你的节点（示例）：
# 🇺🇸美国-1 = vmess://xxx
# 🇺🇸美国-2 = vmess://xxx
# 🇯🇵日本-1 = vmess://xxx
# 🇯🇵日本-2 = vmess://xxx
# 🇸🇬新加坡-1 = vmess://xxx
#
# 在 [policy] 中添加：
# 91rb-Pool = round-robin, 🇺🇸美国-1, 🇺🇸美国-2, 🇯🇵日本-1, 🇯🇵日本-2, 🇸🇬新加坡-1
#
# 在 [filter_local] 中添加：
# HOST-SUFFIX, 91rb.net, 91rb-Pool
#
# ==================== 原理 ====================
# round-robin 模式会自动轮询节点
# 每次请求91rb时自动走不同IP
# 单个IP的额度用完 → 下次请求自动走另一个IP
# 配合缓存脚本 → 已看过的视频永久免限制
# 新视频 → 自动走未用完额度的IP
#
# ==================== 完整配置 ====================

[filter_local]
# 91rb 全站走轮询策略组
HOST-SUFFIX, 91rb.net, 91rb-Pool

[policy]
# 创建轮询策略组（替换为你的实际节点名）
# round-robin = 轮询模式，每次请求自动换节点
# available = 故障转移模式，自动选择可用节点
# 推荐用 round-robin，确保每次请求IP不同
91rb-Pool = round-robin, 你的节点1, 你的节点2, 你的节点3, 你的节点4, 你的节点5

[rewrite_local]
# 拦截视频页面，自动缓存视频URL + IP被限时自动重试
^https?:\/\/(www\.)?91rb\.net\/videos\/ url script-response-body https://raw.githubusercontent.com/XXXGITHUB777/x/main/91rb_unlimited.js

[mitm]
hostname = www.91rb.net, 91rb.net
